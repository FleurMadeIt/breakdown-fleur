name: Rendu breakdown

# Déclenché par Apps Script quand un shot passe en "status": "ready" dans Drive/Breakdowns/_inbox.
# client_payload : { folder_id, shot_name, out_folder_id, token }
on:
  repository_dispatch:
    types: [render-breakdown]

concurrency:
  group: breakdown-${{ github.event.client_payload.folder_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FOLDER_ID: ${{ github.event.client_payload.folder_id }}
      OUT_FOLDER_ID: ${{ github.event.client_payload.out_folder_id }}
      SHOT: ${{ github.event.client_payload.shot_name }}
      BREAKDOWN_DELETE_SOURCES: '1'
      REMOTION_CONCURRENCY: '4'
    steps:
      - name: Masquer le jeton Drive
        run: |
          TOKEN=$(jq -r '.client_payload.token' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$TOKEN"
          echo "DRIVE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Les paquets ffmpeg sont gardés en cache d'un rendu à l'autre (apt-get a déjà bloqué 30 min sur un miroir lent)
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-ffmpeg-${{ runner.os }}-v1

      - name: Installer ffmpeg
        run: |
          mkdir -p ~/apt-cache/partial
          for i in 1 2 3; do
            timeout 300 sudo apt-get -o Dir::Cache::Archives="$HOME/apt-cache" -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg && break
            timeout 300 sudo apt-get -o Acquire::Retries=3 update -qq
          done
          sudo chown -R "$USER" ~/apt-cache
          ffmpeg -version | head -1

      - run: npm install --no-audit --no-fund

      - name: Télécharger le shot depuis Drive
        run: node scripts/drive.mjs fetch "$FOLDER_ID" "work/$SHOT"

      - name: Réglages validés au lancement
        run: |
          if [ "$(jq -r '.client_payload.config | type' "$GITHUB_EVENT_PATH")" = "object" ]; then
            jq '.client_payload.config' "$GITHUB_EVENT_PATH" > "work/$SHOT/shot.json"
            echo "Réglages : $(jq -c '{framing, cropX, start, duration}' "work/$SHOT/shot.json")"
          fi

      - name: Footage de test (mode test du shot.json)
        run: |
          if jq -e '.test == true' "work/$SHOT/shot.json" >/dev/null 2>&1; then node scripts/make-test.mjs "work/$SHOT"; fi

      - name: Rendu Remotion
        run: node scripts/render.mjs "work/$SHOT" out

      - name: Publier dans Drive/_out
        run: node scripts/drive.mjs publish "$FOLDER_ID" "$OUT_FOLDER_ID" out/*.mp4

      - name: Signaler l'erreur dans shot.json
        if: failure()
        run: node scripts/drive.mjs fail "$FOLDER_ID" "Le rendu a échoué, voir GitHub Actions run ${{ github.run_id }}"
